<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>당신이라는 우주</title>
<meta name="description" content="당신의 움직임이 별이 되어 남는 생성형 우주. 별자리를 저장하고 다시 만나세요.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05030a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='30' fill='%23c8a8ff' opacity='0.85'/><circle cx='50' cy='50' r='15' fill='%23ffffff' opacity='0.6'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="nebula-fallback" aria-hidden="true"></div>
<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="stars" aria-label="마우스나 손가락으로 움직이며 별을 만드는 우주"></canvas>
<div id="grain"></div>
<div id="vignette"></div>

<div id="loader">
  <div class="loader-dot"></div>
  <p>우주를 준비하고 있습니다</p>
</div>

<main id="ui">
  <section class="panel" data-idx="0">
    <div class="inner">
      <p class="eyebrow">for you, only</p>
      <h1>당신이라는<br><em>우주</em></h1>
      <p class="sub">당신이 움직이는 모든 순간,<br>이곳에 별이 됩니다.</p>
      <div class="hint-scroll">↓ 스크롤</div>
    </div>
  </section>

  <section class="panel" data-idx="1">
    <div class="inner center">
      <p class="big">우주는<br>당신의 <em>움직임</em>을<br>기억합니다</p>
      <p class="sub small">마우스가 지나간 자리마다<br>별이 남습니다</p>
    </div>
  </section>

  <section class="panel" data-idx="2">
    <div class="inner center">
      <p class="big">이 순간은<br><em>사라지지</em> 않습니다</p>
      <p class="sub small">당신이 잠든 사이에도<br>이 별자리는 이곳에 있습니다</p>
    </div>
  </section>

  <section class="panel" data-idx="3">
    <div class="inner center">
      <h2>당신의 별자리</h2>
      <p id="stats" class="sub"></p>
      <div class="memory-actions">
        <button id="plant" type="button">✦ 별 하나 남기기</button>
        <button id="export" type="button">기억 백업</button>
        <button id="import" type="button">기억 가져오기</button>
        <button id="forget" type="button">기억 지우기</button>
      </div>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
      <p class="privacy-note">기록은 이 브라우저에만 저장됩니다. 공유하려면 JSON 백업을 사용하세요.</p>
    </div>
  </section>
</main>

<div class="visit-counter" aria-hidden="true">✦ <span id="hud-count">0</span></div>
<button id="audio-toggle" type="button" title="소리 켜기/끄기" aria-label="소리 켜기" aria-pressed="false">♪<span class="sound-state"> OFF</span></button>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
